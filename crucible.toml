# Crucible's identity and scope: the one place that says what this downstream build is called, who answers for it and
# which radios it ships. Build, release, docs and site tools read it (CRUCIBLE.md); nothing here changes RadioFoundry's
# own files, so merges from upstream stay clean.

[project]
name = "Crucible"
tagline = "Experimental DMR firmware by KF8S, based on RadioFoundry"
maintainer = "KF8S (David Behnke)"
repo = "https://github.com/wc8mi/crucible"
issues = "https://github.com/wc8mi/crucible/issues"
community = "https://discord.gg/y2jHahNK6h"	# Crucible Community on Discord (Apply to Join, licensed hams)
flasher = "https://tinker.wc8mi.net/crucible/"
upstream = "https://github.com/radiofoundry/radiofoundry"

# The next release, a semantic version (semver.org; CRUCIBLE.md "Versions"). tools/kf8s_build.py names the build
# v<version> and refuses a version already tagged. After each release, raise it: the patch for fixes only, the minor
# for new features, the major (from 1.0.0) for a change that breaks settings or codeplugs. prerelease marks every
# release a GitHub pre-release (a test release); set it false once a build is stable.
[release]
version = "0.1.1"
prerelease = true

# The radios Crucible builds, releases, tests and documents: board ids (boards/<id>/). The other boards stay in the tree
# untouched, so upstream changes to them merge without conflicts; they are just never built or listed here.
[radios]
boards = ["db25d", "dm1701", "dm32", "md9600", "mduv380"]

# What Crucible's CI (tools/ci.sh, .github/workflows/crucible-*.yml) builds beyond each board's default and maximal
# configurations: each switch here built off, so a release can drop it cleanly. Every other switch keeps its default and
# is never built off: upstream's CI covers those. Host tests all run.
[ci]
matrix = ["P25", "NXDN", "YSF", "DMR_IP_GATEWAY", "USB_NETWORK", "HOTSPOT", "APRS", "SATELLITE_TLE"]
# Best effort: features upstream maintains that Crucible ships but doesn't test on its radios. Their host tests run;
# a failure is a warning in the release notes, not a blocker on its own (CRUCIBLE.md, "Releases")
best_effort = ["DMR_IP_GATEWAY", "USB_NETWORK", "SATELLITE_TLE"]
