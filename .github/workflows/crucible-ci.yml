# Crucible's CI (CRUCIBLE.md, "CI"): what a pull request to main must pass. Crucible's boards only
# (crucible.toml [radios]), each default build, its maximal build and the short switch matrix of crucible.toml [ci];
# every host test; the Python, docs and license checks. RadioFoundry's own workflows are removed in this repository:
# upstream runs them on everything else.
name: Crucible CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:   # the upstream sync starts it on its branch (a pull request a workflow opens starts nothing)

permissions:
  contents: read

concurrency:
  group: crucible-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host tests and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: false   # the host tests use none of third_party
      - name: Install tshark, numpy, pytest, pyserial
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            tshark python3-numpy python3-pytest python3-serial
      - name: Host tests, Python checks, license checks, bench tools
        run: tools/ci.sh --steps registry,host,bench,python,licenses
      - name: Crucible's mark is current
        run: python3 tools/crucible_mark.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: host-logs
          path: build/ci/*.log
          if-no-files-found: ignore

  firmware:
    # one job per toolchain; tools/ci.sh narrows each to Crucible's boards on it
    name: firmware (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: arm, name: Arm }
          - { toolchain: csky, name: C-SKY }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Toolchain (platform.toml [toolchain])
        id: tc
        uses: ./.github/actions/toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: third_party submodules
        run: tools/checkout-submodules.sh
      - name: Default, maximal and matrix builds, warnings, stack check, sizes
        env:
          RUN: ${{ steps.tc.outputs.run }}   # empty, or the csky-elf image's run.sh
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -u
          rc=0
          $RUN tools/ci.sh --steps firmware --toolchain "$TOOLCHAIN" || rc=$?
          [ -f build/ci/size-report.md ] && cat build/ci/size-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: firmware-${{ matrix.toolchain }}
          path: |
            build/ci/size-report.md
            build/ci/*.log
          if-no-files-found: ignore
